<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Via Clauss</title>
  <style>
    :root {
      --ouro: #b8965a; --ouro-dark: #9a7a48;
      --rose: #f9ede6; --rose-mid: #e8d5c4; --rose-deep: #d4b896;
      --fundo: #fdf6f0; --card: #ffffff;
      --texto: #3a2a1e; --muted: #8a6a5a; --borda: #e8d5c4; --raio: 4px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: var(--fundo); color: var(--texto); min-height: 100vh; }

    nav { background: #fff; border-bottom: 1px solid var(--borda); padding: 0 2rem; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links button { font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; transition: color 0.12s; }
    .nav-links button:hover, .nav-links button.ativo { color: var(--ouro); }
    #btn-carrinho { background: none; border: 1px solid var(--borda); border-radius: 99px; padding: 8px 20px; font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.12s; }
    #btn-carrinho:hover { border-color: var(--ouro); color: var(--ouro); }
    #btn-carrinho svg { width: 20px; height: 20px; }
    #badge-qtd { background: var(--ouro); color: #fff; border-radius: 99px; padding: 1px 8px; font-size: 12px; font-weight: 600; display: none; }

    .hero { background: var(--rose); border-bottom: 1px solid var(--borda); text-align: center; padding: 2.5rem 1rem 2rem; }
    .hero-mono { font-size: 52px; font-weight: 700; color: var(--ouro); letter-spacing: -3px; line-height: 1; margin-bottom: 4px; }
    .hero-nome { font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--ouro); margin-bottom: 2rem; }
    .hero-banner { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 8px; max-width: 680px; margin: 0 auto; }
    .hero-cell { background: var(--rose-mid); border-radius: var(--raio); aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; overflow: hidden; }
    .hero-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(184,150,90,0.9); padding: 14px 10px; text-align: center; }
    .hero-overlay p { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #fff; line-height: 1.6; }
    .carrossel { border-radius: var(--raio); aspect-ratio: 3/4; overflow: hidden; position: relative; background: var(--rose-deep); }
    .carrossel-slides { display: flex; height: 100%; transition: transform 0.6s ease; will-change: transform; }
    .carrossel-slide { min-width: 100%; height: 100%; flex-shrink: 0; }
    .carrossel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carrossel-slide-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .carrossel-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
    .carrossel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: background 0.2s; border: none; padding: 0; }
    .carrossel-dot.ativo { background: #fff; }

    main { max-width: 1060px; margin: 0 auto; padding: 2rem 1rem 5rem; }
    #busca { width: 100%; padding: 10px 16px; border: 1px solid var(--borda); border-radius: var(--raio); font-family: Georgia, serif; font-size: 13px; color: var(--texto); background: #fff; outline: none; margin-bottom: 1rem; }
    #busca:focus { border-color: var(--ouro); }
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 2rem; }
    .chip { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 16px; border-radius: 99px; border: 1px solid var(--borda); background: #fff; color: var(--muted); cursor: pointer; transition: all 0.12s; }
    .chip:hover { border-color: var(--ouro); color: var(--ouro); }
    .chip.ativo { background: var(--ouro); color: #fff; border-color: var(--ouro); }

    .secao { margin-bottom: 3rem; }
    .secao-header { display: flex; align-items: center; gap: 14px; margin-bottom: 1.25rem; }
    .secao-linha { flex: 1; height: 1px; background: var(--borda); }
    .secao-titulo { font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ouro); white-space: nowrap; }

    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
    .card:hover { border-color: var(--ouro); transform: translateY(-2px); }
    .card-img { width: 100%; aspect-ratio: 2/3; background: var(--rose); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; filter: blur(0.4px); }
    .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .card-badge { font-family: -apple-system, sans-serif; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; padding: 2px 8px; border-radius: 2px; margin-bottom: 6px; }
    .badge-novo { background: var(--rose); color: var(--ouro); }
    .badge-promo { background: #fdf0f0; color: #9a3030; }
    .card-nome { font-size: 13px; color: var(--texto); margin-bottom: 4px; line-height: 1.3; }
    .card-desc { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--muted); margin-bottom: 10px; flex: 1; line-height: 1.4; }
    .card-preco { font-family: -apple-system, sans-serif; font-size: 15px; font-weight: 500; color: var(--ouro-dark); margin-bottom: 10px; }
    .btn-add { width: 100%; padding: 8px; background: var(--ouro); color: #fff; border: none; border-radius: var(--raio); font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.12s; }
    .btn-add:hover { background: var(--ouro-dark); }
    .btn-add:disabled { background: #ccc; cursor: default; }

    #estado { text-align: center; padding: 3rem 1rem; color: var(--muted); font-family: -apple-system, sans-serif; font-size: 14px; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--borda); border-top-color: var(--ouro); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay { display: none; position: fixed; inset: 0; background: rgba(58,42,30,0.4); z-index: 200; }
    #overlay.visivel { display: block; }

    #painel-carrinho { position: fixed; top: 0; right: -420px; width: 100%; max-width: 420px; height: 100vh; background: #fff; z-index: 300; display: flex; flex-direction: column; transition: right 0.25s ease; border-left: 1px solid var(--borda); }
    #painel-carrinho.aberto { right: 0; }
    .painel-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between; }
    .painel-header h2 { font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ouro); }
    #btn-fechar-carrinho { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
    #lista-carrinho { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 12px; }
    .item-carrinho { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--borda); }
    .item-thumb { width: 56px; height: 72px; border-radius: var(--raio); background: var(--rose); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--raio); }
    .item-info { flex: 1; }
    .item-nome { font-size: 13px; margin-bottom: 2px; }
    .item-variante { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .item-preco { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--ouro-dark); font-weight: 500; }
    .item-controles { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .item-controles button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--borda); background: none; cursor: pointer; font-size: 14px; color: var(--texto); }
    .item-controles span { font-family: -apple-system, sans-serif; font-size: 13px; min-width: 18px; text-align: center; }
    .btn-remover { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 4px; }
    .painel-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--borda); }
    .total-linha { display: flex; justify-content: space-between; font-family: -apple-system, sans-serif; font-size: 15px; font-weight: 500; margin-bottom: 1rem; }
    #btn-checkout { width: 100%; padding: 12px; background: #25D366; color: #fff; border: none; border-radius: var(--raio); font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    #btn-checkout:hover { background: #1da851; }
    #carrinho-vazio { text-align: center; padding: 3rem 1rem; color: var(--muted); font-family: -apple-system, sans-serif; font-size: 13px; }

    #modal-checkout { display: none; position: fixed; inset: 0; z-index: 400; align-items: center; justify-content: center; padding: 1rem; }
    #modal-checkout.visivel { display: flex; }
    .modal-box { background: #fff; border-radius: var(--raio); width: 100%; max-width: 440px; padding: 1.5rem; border: 1px solid var(--borda); }
    .modal-box h2 { font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ouro); margin-bottom: 1.25rem; }
    .campo { margin-bottom: 1rem; }
    .campo label { display: block; font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .campo input, .campo textarea { width: 100%; padding: 10px 12px; border-radius: var(--raio); border: 1px solid var(--borda); font-family: Georgia, serif; font-size: 13px; color: var(--texto); background: #fff; outline: none; }
    .campo input:focus, .campo textarea:focus { border-color: var(--ouro); }
    .campo textarea { resize: vertical; min-height: 70px; }
    .modal-botoes { display: flex; gap: 10px; margin-top: 1.25rem; }
    .btn-cancelar { flex: 1; padding: 10px; border: 1px solid var(--borda); background: none; border-radius: var(--raio); font-family: -apple-system, sans-serif; font-size: 13px; cursor: pointer; color: var(--muted); }
    .btn-enviar { flex: 2; padding: 10px; background: #25D366; color: #fff; border: none; border-radius: var(--raio); font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-enviar:hover { background: #1da851; }

    #painel-detalhe { display: none; position: fixed; inset: 0; z-index: 250; background: rgba(58,42,30,0.45); align-items: center; justify-content: center; padding: 1rem; }
    #painel-detalhe.visivel { display: flex; }
    .detalhe-box { background: #fff; border-radius: var(--raio); width: 100%; max-width: 900px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--borda); }
    .detalhe-header { padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .detalhe-header span { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ouro); }
    .detalhe-fechar { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
    .detalhe-corpo { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; flex: 1; }
    .detalhe-esq { background: var(--rose); display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 300px; cursor: zoom-in; position: relative; }
    .detalhe-esq img { width: 100%; height: 100%; object-fit: contain; max-height: 500px; transition: transform 0.3s ease; transform-origin: center center; }
    .detalhe-esq.zoom img { transform: scale(2.2); cursor: zoom-out; }
    .detalhe-esq.zoom { cursor: zoom-out; }
    .detalhe-esq-ph { font-size: 80px; }
    .detalhe-dir { display: flex; flex-direction: column; overflow: hidden; }
    .detalhe-info { padding: 1.5rem; border-bottom: 1px solid var(--borda); flex-shrink: 0; overflow-y: auto; }
    .detalhe-cat { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ouro); margin-bottom: 8px; }
    .detalhe-nome { font-size: 20px; color: var(--texto); margin-bottom: 6px; line-height: 1.2; }
    .detalhe-desc { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
    .detalhe-preco { font-family: -apple-system, sans-serif; font-size: 24px; font-weight: 500; color: var(--ouro-dark); margin-bottom: 14px; }
    .detalhe-estoque { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .btn-add-detalhe { width: 100%; padding: 11px; background: var(--ouro); color: #fff; border: none; border-radius: var(--raio); font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.12s; }
    .btn-add-detalhe:hover { background: var(--ouro-dark); }
    .btn-add-detalhe:disabled { background: #ccc; cursor: default; }
    .btn-ver-carrinho { width: 100%; padding: 11px; background: none; color: var(--ouro-dark); border: 1px solid var(--ouro); border-radius: var(--raio); font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.12s; margin-top: 8px; }
    .btn-ver-carrinho:hover { background: var(--rose); }
    .detalhe-rel { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
    .rel-titulo { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ouro); margin-bottom: 10px; }
    .rel-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .rel-card { background: var(--fundo); border-radius: var(--raio); border: 1px solid var(--borda); overflow: hidden; cursor: pointer; transition: border-color 0.12s; }
    .rel-card:hover { border-color: var(--ouro); }
    .rel-img { width: 100%; aspect-ratio: 3/4; background: var(--rose); display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .rel-img img { width: 100%; height: 100%; object-fit: cover; }
    .rel-nome { font-size: 11px; padding: 5px 6px; color: var(--texto); line-height: 1.3; }
    .rel-preco { font-family: -apple-system, sans-serif; font-size: 11px; padding: 0 6px 6px; color: var(--ouro-dark); font-weight: 500; }

    .var-secao { margin-bottom: 14px; }
    .var-label { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .var-opcoes { display: flex; gap: 6px; flex-wrap: wrap; }
    .var-btn { padding: 5px 14px; border-radius: 4px; border: 1px solid var(--borda); background: #fff; font-family: -apple-system, sans-serif; font-size: 12px; cursor: pointer; transition: all 0.12s; color: var(--texto); }
    .var-btn:hover:not(:disabled) { border-color: var(--ouro); color: var(--ouro); }
    .var-btn.sel { background: var(--ouro); color: #fff; border-color: var(--ouro); }
    .var-btn.esgotado { background: #f5f5f5; color: #bbb; border-color: #eee; cursor: default; text-decoration: line-through; }

    footer { background: var(--texto); padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .footer-mono { font-size: 32px; font-weight: 700; color: var(--ouro); letter-spacing: -2px; }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #c4a882; cursor: pointer; }
    .footer-links a:hover { color: var(--ouro); }

    @media (max-width: 600px) {
      .grade { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      #painel-carrinho { max-width: 100%; }
      .detalhe-corpo { grid-template-columns: 1fr; }
      .detalhe-esq { max-height: 220px; }
      .detalhe-rel { display: none; }
      .hero-banner { grid-template-columns: 1fr 1.5fr 1fr; }
      .nav-links { display: none; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>

    <div class="modal-botoes">
      <button class="btn-cancelar" id="btn-cancelar-checkout">Voltar</button>
      <button class="btn-enviar" id="btn-enviar-pedido">Enviar pedido</button>
    </div>
  </div>
</div>

<div id="painel-detalhe">
  <div class="detalhe-box">
    <div class="detalhe-header">
      <span id="detalhe-breadcrumb"></span>
      <button class="detalhe-fechar" id="btn-fechar-detalhe">×</button>
    </div>
    <div class="detalhe-corpo">
      <div class="detalhe-esq" id="detalhe-img-wrap"></div>
      <div class="detalhe-dir">
        <div class="detalhe-info">
          <p class="detalhe-cat" id="detalhe-cat"></p>
          <h2 class="detalhe-nome" id="detalhe-nome"></h2>
          <p class="detalhe-desc" id="detalhe-desc"></p>
          <div class="detalhe-preco" id="detalhe-preco"></div>
          <div id="detalhe-variantes"></div>
          <p class="detalhe-estoque" id="detalhe-estoque"></p>
          <button class="btn-add-detalhe" id="btn-add-detalhe">Adicionar ao carrinho</button>
          <button class="btn-ver-carrinho" id="btn-ver-carrinho">Ver carrinho <span id="badge-ver-carrinho" style="background:var(--ouro);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;display:none;margin-left:2px"></span></button>
        </div>
        <div class="detalhe-rel">
          <p class="rel-titulo">Mais da mesma categoria</p>
          <div class="rel-grade" id="rel-grade"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let produtos = [], carrinho = [], categoriaAtiva = "";

  async function carregarProdutos() {
    try {
      const res = await fetch(CONFIG.sheetCsvUrl);
      if (!res.ok) throw new Error("Não foi possível carregar a planilha.");
      produtos = parseCsv(await res.text());
      popularFiltros();
      renderizar();
    } catch (e) {
      document.getElementById("conteudo").innerHTML = `<div id="estado"><p>⚠️ Erro ao carregar produtos.<br><small>${e.message}</small></p></div>`;
    }
  }

  function parseCsv(text) {
    const linhas = text.trim().split("\n");
    const cab = linhas[0].split(",").map(c => c.trim().toLowerCase().replace(/"/g, ""));
    return linhas.slice(1).map(linha => {
      const cols = parseLinha(linha); const obj = {};
      cab.forEach((key, i) => obj[key] = (cols[i] || "").trim().replace(/^"|"$/g, ""));
      const ps = (obj.preco || "").toString().replace(/[^\d.,]/g, "").trim();
      obj.preco = ps.includes(",") ? parseFloat(ps.replace(/\./g, "").replace(",", ".")) || 0 : parseFloat(ps) || 0;
      obj.variantesObj = parseVariantes(obj.variantes || "");
      if (obj.variantesObj.length > 0) {
        obj.estoque = obj.variantesObj.reduce((s, v) => s + v.qtd, 0);
      } else {
        obj.estoque = obj.estoque !== "" && obj.estoque !== undefined ? parseInt(obj.estoque) : 99;
      }
      return obj;
    }).filter(p => p.nome);
  }

  function parseVariantes(str) {
    if (!str) return [];
    return str.split(";").map(p => {
      const [chave, qtd] = p.split(":");
      const [cor, tam] = (chave || "").split("/");
      return { cor: cor?.trim() || "", tam: tam?.trim() || "", qtd: parseInt(qtd) || 0 };
    }).filter(v => v.cor);
  }

  function parseLinha(linha) {
    const cols = []; let atual = ""; let dentro = false;
    for (let i = 0; i < linha.length; i++) {
      const c = linha[i];
      if (c === '"') { dentro = !dentro; }
      else if (c === "," && !dentro) { cols.push(atual); atual = ""; }
      else { atual += c; }
    }
    cols.push(atual); return cols;
  }

  function popularFiltros() {
    const cats = [...new Set(produtos.map(p => p.categoria).filter(Boolean))];
    const div = document.getElementById("filtros");
    cats.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "chip"; btn.dataset.cat = cat; btn.textContent = cat;
      btn.addEventListener("click", () => filtrar(cat, btn));
      div.appendChild(btn);
    });
    div.querySelector("[data-cat='']").addEventListener("click", e => filtrar("", e.target));
    div.querySelector("[data-cat='novidades']").addEventListener("click", e => filtrar("novidades", e.target));
  }

  function filtrar(cat, btn) {
    categoriaAtiva = cat;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("ativo"));
    btn.classList.add("ativo");
    sincNav(cat);
    renderizar();
  }

  function filtrarNav(cat) {
    categoriaAtiva = cat;
    document.querySelectorAll(".nav-links button").forEach(b => b.classList.remove("ativo"));
    const ids = { "": "nav-todos", "novidades": "nav-novidades", "roupas": "nav-roupas", "semijoias": "nav-semijoias" };
    const nb = document.getElementById(ids[cat] || "nav-todos");
    if (nb) nb.classList.add("ativo");
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("ativo"));
    const chip = document.querySelector(`.chip[data-cat="${cat}"]`);
    if (chip) chip.classList.add("ativo");
    renderizar();
  }

  function sincNav(cat) {
    document.querySelectorAll(".nav-links button").forEach(b => b.classList.remove("ativo"));
    const ids = { "": "nav-todos", "novidades": "nav-novidades", "roupas": "nav-roupas", "semijoias": "nav-semijoias" };
    const nb = document.getElementById(ids[cat] || "nav-todos");
    if (nb) nb.classList.add("ativo");
  }

  document.getElementById("busca").addEventListener("input", renderizar);

  function renderizar() {
    const termo = document.getElementById("busca").value.toLowerCase();
    const conteudo = document.getElementById("conteudo");
    const filtrados = produtos.filter(p => {
      const mb = !termo || p.nome.toLowerCase().includes(termo) || (p.descricao || "").toLowerCase().includes(termo);
      if (!mb) return false;
      if (categoriaAtiva === "novidades") return p.badge === "novo";
      if (categoriaAtiva === "") return true;
      return p.categoria?.toLowerCase() === categoriaAtiva.toLowerCase();
    });
    conteudo.innerHTML = "";
    if (filtrados.length === 0) { conteudo.innerHTML = `<div id="estado">Nenhum produto encontrado.</div>`; return; }
    if (categoriaAtiva === "" && !termo) {
      const cats = [...new Set(filtrados.map(p => p.categoria).filter(Boolean))];
      cats.forEach(cat => {
        const sec = document.createElement("div"); sec.className = "secao";
        sec.innerHTML = `<div class="secao-header"><div class="secao-linha"></div><div class="secao-titulo">${cat}</div><div class="secao-linha"></div></div><div class="grade"></div>`;
        filtrados.filter(p => p.categoria === cat).forEach(prod => sec.querySelector(".grade").appendChild(criarCard(prod)));
        conteudo.appendChild(sec);
      });
    } else {
      const titulo = categoriaAtiva === "novidades" ? "Novidades" : (categoriaAtiva || "Resultados");
      const sec = document.createElement("div"); sec.className = "secao";
      sec.innerHTML = `<div class="secao-header"><div class="secao-linha"></div><div class="secao-titulo">${titulo}</div><div class="secao-linha"></div></div><div class="grade"></div>`;
      filtrados.forEach(prod => sec.querySelector(".grade").appendChild(criarCard(prod)));
      conteudo.appendChild(sec);
    }
  }

  function criarCard(prod) {
    const card = document.createElement("div"); card.className = "card";
    const semEstoque = prod.estoque <= 0;
    const temVar = prod.variantesObj && prod.variantesObj.length > 0;
    const badgeHtml = prod.badge === "novo" ? `<span class="card-badge badge-novo">Novo</span>` : prod.badge === "promo" ? `<span class="card-badge badge-promo">Promo</span>` : "";
    card.innerHTML = `
      ${prod.imagem ? `<div class="card-img"><img src="${prod.imagem}" alt="${prod.nome}" loading="lazy" /></div>` : `<div class="card-img">🧥</div>`}
      <div class="card-body">
        ${badgeHtml}
        <p class="card-nome">${prod.nome}</p>
        <p class="card-desc">${prod.descricao || ""}</p>
        <p class="card-preco">R$ ${prod.preco.toFixed(2).replace(".", ",")}</p>
        <button class="btn-add" ${semEstoque ? "disabled" : ""}>${semEstoque ? "Sem estoque" : temVar ? "Ver opções" : "Adicionar ao carrinho"}</button>
      </div>`;
    if (!semEstoque) {
      card.querySelector(".btn-add").addEventListener("click", e => {
        e.stopPropagation();
        abrirDetalhe(prod);
      });
    }
    card.addEventListener("click", () => abrirDetalhe(prod));
    return card;
  }

  function rotularVariante(v) { return v.cor + (v.tam ? " / " + v.tam : ""); }

  function adicionarAoCarrinho(prod, variante = null) {
    const chave = prod.nome + (variante ? "|" + variante : "");
    const ex = carrinho.find(i => i._chave === chave);
    const estoqueDisp = variante
      ? (prod.variantesObj.find(v => rotularVariante(v) === variante)?.qtd || 0)
      : prod.estoque;
    if (ex) {
      if (ex.qtd >= estoqueDisp) return;
      ex.qtd++;
    } else {
      carrinho.push({ ...prod, qtd: 1, _chave: chave, _variante: variante });
    }
    atualizarCarrinho();
  }

  function atualizarCarrinho() {
    const total = carrinho.reduce((s, i) => s + i.preco * i.qtd, 0);
    const qtd = carrinho.reduce((s, i) => s + i.qtd, 0);
    const badge = document.getElementById("badge-qtd");
    badge.textContent = qtd; badge.style.display = qtd > 0 ? "inline" : "none";
    const badgeVer = document.getElementById("badge-ver-carrinho");
    if (badgeVer) { badgeVer.textContent = qtd; badgeVer.style.display = qtd > 0 ? "inline" : "none"; }
    const lista = document.getElementById("lista-carrinho");
    const footer = document.getElementById("footer-carrinho");
    if (carrinho.length === 0) { lista.innerHTML = `<div id="carrinho-vazio">Seu carrinho está vazio.</div>`; footer.style.display = "none"; return; }
    footer.style.display = "block";
    document.getElementById("total-valor").textContent = `R$ ${total.toFixed(2).replace(".", ",")}`;
    lista.innerHTML = "";
    carrinho.forEach((item, idx) => {
      const div = document.createElement("div"); div.className = "item-carrinho";
      div.innerHTML = `
        ${item.imagem ? `<div class="item-thumb"><img src="${item.imagem}" alt="${item.nome}" /></div>` : `<div class="item-thumb">🧥</div>`}
        <div class="item-info">
          <p class="item-nome">${item.nome}</p>
          ${item._variante ? `<p class="item-variante">${item._variante}</p>` : ""}
          <p class="item-preco">R$ ${(item.preco * item.qtd).toFixed(2).replace(".", ",")}</p>
          <div class="item-controles">
            <button data-idx="${idx}" data-acao="menos">−</button>
            <span>${item.qtd}</span>
            <button data-idx="${idx}" data-acao="mais">+</button>
          </div>
        </div>
        <button class="btn-remover" data-idx="${idx}">✕</button>`;
      div.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.dataset.idx); const acao = btn.dataset.acao;
          const estDisp = carrinho[i]._variante
            ? (carrinho[i].variantesObj?.find(v => rotularVariante(v) === carrinho[i]._variante)?.qtd || 99)
            : carrinho[i].estoque;
          if (acao === "mais") { if (carrinho[i].qtd < estDisp) carrinho[i].qtd++; }
          else if (acao === "menos") { carrinho[i].qtd--; if (carrinho[i].qtd <= 0) carrinho.splice(i, 1); }
          else { carrinho.splice(i, 1); }
          atualizarCarrinho();
        });
      });
      lista.appendChild(div);
    });
  }

  function abrirCarrinho() { document.getElementById("painel-carrinho").classList.add("aberto"); document.getElementById("overlay").classList.add("visivel"); atualizarCarrinho(); }
  function fecharCarrinho() { document.getElementById("painel-carrinho").classList.remove("aberto"); document.getElementById("overlay").classList.remove("visivel"); }
  document.getElementById("btn-carrinho").addEventListener("click", abrirCarrinho);
  document.getElementById("btn-fechar-carrinho").addEventListener("click", fecharCarrinho);
  document.getElementById("overlay").addEventListener("click", fecharCarrinho);

  document.getElementById("btn-checkout").addEventListener("click", () => { fecharCarrinho(); document.getElementById("modal-checkout").classList.add("visivel"); document.getElementById("overlay").classList.add("visivel"); });
  document.getElementById("btn-cancelar-checkout").addEventListener("click", () => { document.getElementById("modal-checkout").classList.remove("visivel"); document.getElementById("overlay").classList.remove("visivel"); abrirCarrinho(); });
  document.getElementById("btn-enviar-pedido").addEventListener("click", () => {
    const nome = document.getElementById("campo-nome").value.trim();
    const fone = document.getElementById("campo-fone").value.trim();
    const obs = document.getElementById("campo-obs").value.trim();
    if (!nome || !fone) { alert("Preencha seu nome e WhatsApp para continuar."); return; }
    const itens = carrinho.map(i => `• ${i.nome}${i._variante ? " (" + i._variante + ")" : ""} (x${i.qtd}) — R$ ${(i.preco * i.qtd).toFixed(2).replace(".", ",")}`).join("\n");
    const total = carrinho.reduce((s, i) => s + i.preco * i.qtd, 0);
    let msg = `*Novo pedido — ${CONFIG.nomeLoja}*\n\n*Cliente:* ${nome}\n*Contato:* ${fone}\n\n*Itens:*\n${itens}\n\n*Total: R$ ${total.toFixed(2).replace(".", ",")}*`;
    if (obs) msg += `\n\n*Observações:* ${obs}`;
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
    carrinho = []; atualizarCarrinho();
    document.getElementById("modal-checkout").classList.remove("visivel"); document.getElementById("overlay").classList.remove("visivel");
    document.getElementById("campo-nome").value = ""; document.getElementById("campo-fone").value = ""; document.getElementById("campo-obs").value = "";
  });

  let varianteSelecionada = null;

  function abrirDetalhe(prod) {
    varianteSelecionada = null;
    const w = document.getElementById("detalhe-img-wrap");
    w.innerHTML = prod.imagem ? `<img src="${prod.imagem}" alt="${prod.nome}" />` : `<div class="detalhe-esq-ph">🧥</div>`;
    document.getElementById("detalhe-breadcrumb").textContent = prod.categoria || "";
    document.getElementById("detalhe-cat").textContent = prod.categoria || "";
    document.getElementById("detalhe-nome").textContent = prod.nome;
    document.getElementById("detalhe-desc").textContent = prod.descricao || "";
    document.getElementById("detalhe-preco").textContent = `R$ ${prod.preco.toFixed(2).replace(".", ",")}`;

    const varDiv = document.getElementById("detalhe-variantes");
    varDiv.innerHTML = "";
    const temVar = prod.variantesObj && prod.variantesObj.length > 0;

    if (temVar) {
      const cores = [...new Set(prod.variantesObj.map(v => v.cor))];
      const tamanhos = [...new Set(prod.variantesObj.map(v => v.tam).filter(Boolean))];
      if (cores.length > 0) {
        const sec = document.createElement("div"); sec.className = "var-secao";
        sec.innerHTML = `<p class="var-label">Cor</p><div class="var-opcoes" id="opcoes-cor"></div>`;
        varDiv.appendChild(sec);
        cores.forEach(cor => {
          const btn = document.createElement("button"); btn.className = "var-btn"; btn.textContent = cor; btn.dataset.cor = cor;
          btn.addEventListener("click", () => selecionarCor(prod, cor));
          document.getElementById("opcoes-cor").appendChild(btn);
        });
      }
      if (tamanhos.length > 0) {
        const sec = document.createElement("div"); sec.className = "var-secao";
        sec.innerHTML = `<p class="var-label">Tamanho</p><div class="var-opcoes" id="opcoes-tam"></div>`;
        varDiv.appendChild(sec);
        tamanhos.forEach(tam => {
          const btn = document.createElement("button"); btn.className = "var-btn esgotado"; btn.textContent = tam; btn.dataset.tam = tam; btn.disabled = true;
          document.getElementById("opcoes-tam").appendChild(btn);
        });
      }
    }

    const semEstoque = prod.estoque <= 0;
    document.getElementById("detalhe-estoque").textContent = semEstoque ? "Sem estoque" : (prod.estoque < 99 && !temVar ? `${prod.estoque} disponíveis` : "");
    const btnAdd = document.getElementById("btn-add-detalhe");
    btnAdd.disabled = semEstoque || temVar;
    btnAdd.textContent = semEstoque ? "Sem estoque" : temVar ? "Selecione uma opção" : "Adicionar ao carrinho";
    btnAdd.onclick = () => { adicionarAoCarrinho(prod, varianteSelecionada); };

    const rg = document.getElementById("rel-grade"); rg.innerHTML = "";
    const rel = produtos.filter(p => p.categoria === prod.categoria && p.nome !== prod.nome);
    if (rel.length === 0) { rg.innerHTML = `<p style="font-size:12px;color:var(--muted);font-family:sans-serif">Nenhum outro produto nesta categoria.</p>`; }
    else { rel.forEach(r => { const d = document.createElement("div"); d.className = "rel-card"; d.innerHTML = `<div class="rel-img">${r.imagem ? `<img src="${r.imagem}" alt="${r.nome}" loading="lazy" />` : "🧥"}</div><p class="rel-nome">${r.nome}</p><p class="rel-preco">R$ ${r.preco.toFixed(2).replace(".", ",")}</p>`; d.addEventListener("click", () => abrirDetalhe(r)); rg.appendChild(d); }); }
    document.getElementById("painel-detalhe").classList.add("visivel");
  }

  function selecionarCor(prod, cor) {
    varianteSelecionada = null;
    document.querySelectorAll("#opcoes-cor .var-btn").forEach(b => b.classList.toggle("sel", b.dataset.cor === cor));
    const tamDiv = document.getElementById("opcoes-tam");
    const btnAdd = document.getElementById("btn-add-detalhe");
    const varsDaCor = prod.variantesObj.filter(v => v.cor === cor);
    const temTam = varsDaCor.some(v => v.tam);
    if (!temTam) {
      const v = varsDaCor[0];
      varianteSelecionada = rotularVariante(v);
      const sem = v.qtd <= 0;
      btnAdd.disabled = sem;
      btnAdd.textContent = sem ? "Sem estoque" : "Adicionar ao carrinho";
      document.getElementById("detalhe-estoque").textContent = sem ? "Sem estoque" : `${v.qtd} disponíveis`;
    } else {
      btnAdd.disabled = true; btnAdd.textContent = "Selecione o tamanho";
      if (tamDiv) tamDiv.querySelectorAll(".var-btn").forEach(b => {
        b.className = "var-btn"; b.disabled = false;
        const v = varsDaCor.find(x => x.tam === b.dataset.tam);
        if (!v || v.qtd <= 0) { b.classList.add("esgotado"); b.disabled = true; }
        b.onclick = () => selecionarTam(prod, cor, b.dataset.tam);
      });
    }
  }

  function selecionarTam(prod, cor, tam) {
    document.querySelectorAll("#opcoes-tam .var-btn").forEach(b => b.classList.toggle("sel", b.dataset.tam === tam && !b.classList.contains("esgotado")));
    const v = prod.variantesObj.find(x => x.cor === cor && x.tam === tam);
    varianteSelecionada = rotularVariante(v);
    const sem = !v || v.qtd <= 0;
    const btnAdd = document.getElementById("btn-add-detalhe");
    btnAdd.disabled = sem;
    btnAdd.textContent = sem ? "Sem estoque" : "Adicionar ao carrinho";
    document.getElementById("detalhe-estoque").textContent = sem ? "Sem estoque" : `${v.qtd} disponíveis`;
  }

  function fecharDetalhe() { document.getElementById("painel-detalhe").classList.remove("visivel"); }
  document.getElementById("btn-ver-carrinho").addEventListener("click", () => { fecharDetalhe(); abrirCarrinho(); });
  document.getElementById("btn-fechar-detalhe").addEventListener("click", fecharDetalhe);
  document.getElementById("painel-detalhe").addEventListener("click", function(e) { if (e.target === this) fecharDetalhe(); });

  /* ── Zoom na imagem ── */
  document.getElementById("detalhe-img-wrap").addEventListener("click", function() {
    this.classList.toggle("zoom");
  });
  document.getElementById("detalhe-img-wrap").addEventListener("mousemove", function(e) {
    if (!this.classList.contains("zoom")) return;
    const rect = this.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    const img = this.querySelector("img");
    if (img) img.style.transformOrigin = `${x}% ${y}%`;
  });
  document.getElementById("detalhe-img-wrap").addEventListener("mouseleave", function() {
    this.classList.remove("zoom");
    const img = this.querySelector("img");
    if (img) img.style.transformOrigin = "center center";
  });

  /* ── Carrossel banner ──────────────────────────────────── */
  let carrosselIdx = 0;
  let carrosselTimer = null;

  async function carregarCarrossel() {
    try {
      const res = await fetch(CONFIG.sheetCsvUrl.replace("pub?output=csv", "pub?output=csv&gid=") + "&gid=0");
      const bannerRes = await fetch(CONFIG.sheetCsvUrl.replace(/\/pub\?.*/, "/pub?gid=") + CONFIG.bannerGid + "&output=csv");
      if (!bannerRes.ok) return;
      const text = await bannerRes.text();
      const urls = text.trim().split("\n").slice(1).map(l => l.trim().replace(/^"|"$/g, "")).filter(Boolean);
      if (urls.length === 0) return;
      const slides = document.getElementById("carrossel-slides");
      const dots = document.getElementById("carrossel-dots");
      slides.innerHTML = "";
      dots.innerHTML = "";
      urls.forEach((url, i) => {
        const slide = document.createElement("div"); slide.className = "carrossel-slide";
        slide.innerHTML = `<img src="${url}" alt="Banner ${i+1}" loading="lazy" />`;
        slides.appendChild(slide);
        const dot = document.createElement("button"); dot.className = "carrossel-dot" + (i === 0 ? " ativo" : "");
        dot.addEventListener("click", () => irParaSlide(i));
        dots.appendChild(dot);
      });
      iniciarCarrossel(urls.length);
    } catch(e) { console.log("Banner não carregado:", e.message); }
  }

  async function carregarCarrosselViaApi() {
    try {
      const res = await fetch(CONFIG.apiUrl, { method: "POST", body: JSON.stringify({ acao: "listarBanner", senha: "" }) });
      const data = await res.json();
      if (!data.ok || !data.urls || data.urls.length === 0) return;
      const slides = document.getElementById("carrossel-slides");
      const dots = document.getElementById("carrossel-dots");
      slides.innerHTML = ""; dots.innerHTML = "";
      data.urls.forEach((url, i) => {
        const slide = document.createElement("div"); slide.className = "carrossel-slide";
        slide.innerHTML = `<img src="${url}" alt="Banner ${i+1}" loading="lazy" />`;
        slides.appendChild(slide);
        const dot = document.createElement("button"); dot.className = "carrossel-dot" + (i === 0 ? " ativo" : "");
        dot.addEventListener("click", () => irParaSlide(i));
        dots.appendChild(dot);
      });
      iniciarCarrossel(data.urls.length);
    } catch(e) { console.log("Carrossel:", e.message); }
  }

  function iniciarCarrossel(total) {
    if (total <= 1) return;
    carrosselIdx = 0;
    if (carrosselTimer) clearInterval(carrosselTimer);
    carrosselTimer = setInterval(() => irParaSlide((carrosselIdx + 1) % total), 4000);
  }

  function irParaSlide(idx) {
    carrosselIdx = idx;
    const slides = document.getElementById("carrossel-slides");
    slides.style.transform = `translateX(-${idx * 100}%)`;
    document.querySelectorAll(".carrossel-dot").forEach((d, i) => d.classList.toggle("ativo", i === idx));
  }

  carregarCarrosselViaApi();

  carregarProdutos();
</script>
</body>
</html>
