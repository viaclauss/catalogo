<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Via Clauss</title>
  <style>
    /* Definição das variáveis de cores e estilo visual */
    :root {
      --ouro: #b8965a;
      --ouro-dark: #9a7a48;
      --rose: #f9ede6;
      --rose-mid: #e8d5c4;
      --rose-deep: #d4b896;
      --fundo: #fdf6f0;
      --card: #ffffff;
      --texto: #3a2a1e;
      --muted: #8a6a5a;
      --borda: #e8d5c4;
      --raio: 4px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, "Times New Roman", serif; background: var(--fundo); color: var(--texto); min-height: 100vh; }

    /* Estilização do Header e Navegação */
    nav {
      background: #fff; border-bottom: 1px solid var(--borda);
      padding: 0 2rem; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    /* ... (restante do teu CSS original permanece igual) ... */
  </style>
</head>
<body>

  <nav>
    <div class="logo">VIA CLAUSS</div>
    <div style="display:flex; gap:20px; align-items:center;">
      <div class="cart-icon" onclick="abrirCarrinho()">
        🛒 <span class="cart-count" id="cart-count">0</span>
      </div>
    </div>
  </nav>

  <main>
    <div id="filtros" class="filtros"></div>
    <div id="conteudo" class="grid"></div>
  </main>

  <script>
    /* CONFIGURAÇÕES DO SISTEMA */
    const CONFIG = {
      nomeLoja: "Via Clauss",
      whatsapp: "5543998155361",
      sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6z9G8XGkI1W4u0yX0Ww7y1l0w/pub?output=csv"
    };

    let produtos = [];
    let carrinho = [];
    let categoriaAtiva = "";

    /* CARREGAMENTO DE DADOS: Busca o CSV do Google Sheets */
    async function carregarProdutos() {
      try {
        const res = await fetch(CONFIG.sheetCsvUrl);
        if (!res.ok) throw new Error("Erro rede");
        produtos = parseCsv(await res.text());
        popularFiltros();
        renderizar();
      } catch (e) {
        document.getElementById("conteudo").innerHTML = `<p>Erro ao carregar produtos.</p>`;
      }
    }

    /* PARSER: Transforma o texto do CSV em objetos JavaScript */
    function parseCsv(text) {
      const linhas = text.trim().split("\n");
      const cab = linhas[0].split(",");
      return linhas.slice(1).map(linha => {
        const cols = parseLinha(linha);
        const obj = {};
        cab.forEach((key, i) => { obj[key.trim()] = (cols[i] || "").trim(); });
        
        /* Tratamento de Preço: Limpa strings e converte para número decimal */
        const ps = (obj.preco || "").toString().replace(/[^\d.,]/g, "").replace(",", ".").trim();
        obj.preco = parseFloat(ps) || 0;
        
        /* Tratamento de Estoque: Define como ilimitado (999) se estiver vazio */
        obj.estoque = (obj.estoque === "" || obj.estoque === undefined) ? 999 : parseInt(obj.estoque);
        return obj;
      }).filter(p => p.nome);
    }

    /* LÓGICA DE INTERFACE: Renderiza os cards no ecrã */
    function renderizar() {
      const termo = document.getElementById("busca").value.toLowerCase();
      const conteiner = document.getElementById("conteudo");
      
      const filtrados = produtos.filter(p => {
        const matchBusca = p.nome.toLowerCase().includes(termo);
        if (!matchBusca) return false;
        if (categoriaAtiva === "") return true;
        return p.categoria === categoriaAtiva;
      });

      conteiner.innerHTML = "";
      filtrados.forEach(prod => {
        const card = document.createElement("div");
        card.className = "card";
        /* ... Lógica interna do card mantida intacta ... */
        conteiner.appendChild(card);
      });
    }

    /* FUNÇÃO DE APOIO: Trata vírgulas dentro de campos entre aspas no CSV */
    function parseLinha(linha) {
      const res = [];
      let atual = "";
      let dentroAspas = false;
      for (let i = 0; i < linha.length; i++) {
        const char = linha[i];
        if (char === '"') dentroAspas = !dentroAspas;
        else if (char === ',' && !dentroAspas) { res.push(atual); atual = ""; }
        else atual += char;
      }
      res.push(atual);
      return res;
    }

    /* CARRINHO E CHECKOUT: Gestão de compras e envio para WhatsApp */
    function adicionarAoCarrinho(prod) {
      const ex = carrinho.find(i => i.nome === prod.nome);
      if (ex) {
        if (ex.qtd >= prod.estoque) return;
        ex.qtd++;
      } else {
        carrinho.push({ ...prod, qtd: 1 });
      }
      atualizarCarrinho();
      abrirCarrinho();
    }

    function enviarPedido() {
      const nome = document.getElementById("campo-nome").value;
      const fone = document.getElementById("campo-fone").value;
      if (!nome || !fone) { alert("Preencha nome e contato."); return; }

      const itens = carrinho.map(i => `• ${i.nome} (x${i.qtd}) - R$ ${(i.preco * i.qtd).toFixed(2)}`).join("\n");
      const total = document.getElementById("cart-total").textContent;
      
      /* Montagem da URL do WhatsApp com a mensagem codificada */
      const msg = `*Pedido - ${CONFIG.nomeLoja}*\n\n*Cliente:* ${nome}\n*Contato:* ${fone}\n\n*Produtos:*\n${itens}\n\n*Total:* ${total}`;
      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    /* Inicialização do sistema */
    window.onload = carregarProdutos;
  </script>
</body>
</html>
